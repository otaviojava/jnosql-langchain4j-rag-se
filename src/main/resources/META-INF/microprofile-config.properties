# Eclipse JNoSQL
jnosql.vector.database=policies

# Qdrant
jnosql.qdrant.host=localhost
jnosql.qdrant.port=6334
jnosql.qdrant.collection.distance=COSINE
jnosql.qdrant.collection.vector.size=384

# LangChain4j - Vector Search
rag.qdrant.tls=false
# Must be large enough to include every revision of the relevant policies
rag.search.max-results=10

# LangChain4j - LLM
rag.chat.model=gpt-4o-mini
dev.langchain4j.cdi.plugin.openai.class=dev.langchain4j.model.openai.OpenAiChatModel
dev.langchain4j.cdi.plugin.openai.scope=jakarta.enterprise.context.ApplicationScoped
dev.langchain4j.cdi.plugin.openai.config.apiKey=${RAG_CHAT_API_KEY}
dev.langchain4j.cdi.plugin.openai.config.modelName=gpt-4o-mini

# API key is resolved from the RAG_CHAT_API_KEY environment variable (see .env.example)
